name: Build Momentum Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the APK to a public GitHub Release for direct browser download
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and build Android wrapper
        run: |
          npm install
          npm --prefix client install
          npm --prefix server install
          npm run build
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - name: Publish direct-download APK
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk#Momentum.apk --title "Momentum Android APK" --notes "Install Momentum.apk directly from an Android browser. Android may ask you to allow installs from this browser."
      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
