services:
  - type: web
    name: momentum
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm --prefix server install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: momentum-db
          property: connectionString
databases:
  - name: momentum-db
    plan: free
    databaseName: momentum
    user: momentum
